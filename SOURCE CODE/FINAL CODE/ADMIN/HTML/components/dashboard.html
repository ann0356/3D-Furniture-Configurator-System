<div class="dashboard-page">
    <div class="page-header">
        <h2><i class="fa-solid fa-chart-line" aria-hidden="true"></i> Dashboard</h2>
        
        <div class="action-bar" style="display: flex; gap: 15px; align-items: center;">
            <label class="sr-only" for="filter-year">Filter dashboard by year</label>
            <select id="filter-year">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>

            <label class="sr-only" for="filter-month">Filter dashboard by month</label>
            <select id="filter-month">
                <option value="all">All Year</option>
                <option value="01">Jan</option>
                <option value="02">Feb</option>
                <option value="03">Mar</option>
                <option value="04">Apr</option>
                <option value="05">May</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Aug</option>
                <option value="09">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
            </select>

            <button id="export-report-btn" class="admin-btn admin-btn-primary" type="button">
                <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> Export report
            </button>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <h3>Total Revenue</h3>
            <p id="kpi-revenue" style="font-size: 24px; font-weight: bold; color: #2ecc71;">Loading...</p>
        </div>
        <div class="kpi-card">
            <h3>Total Orders</h3>
            <p id="kpi-orders" style="font-size: 24px; font-weight: bold; color: #3498db;">Loading...</p>
        </div>
        <div class="kpi-card">
            <h3>New Users</h3>
            <p id="kpi-users" style="font-size: 24px; font-weight: bold; color: #9b59b6;">Loading...</p>
        </div>
        <div class="kpi-card">
            <h3>Top Product</h3>
            <p id="kpi-hot-product" style="font-size: 20px; font-weight: bold; color: #e67e22;">Loading...</p>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <h3><i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i> Sales trend</h3>
            <canvas id="salesChart"></canvas>
        </div>

        <div class="chart-container">
            <h3><i class="fa-solid fa-couch" aria-hidden="true"></i> Top categories</h3>
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
</div>
