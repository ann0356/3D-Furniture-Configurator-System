<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- logo on browser tab -->
    <link rel = "icon" type = "image/png" href = "https://dzgtfwdqfqecetnfhcdi.supabase.co/storage/v1/object/public/furniture-images/ruma_logo_white.png">
    <title>Ruma Home | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/admin_index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- chart, pdf export, 3D view -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body class="admin-auth-pending">
    <!-- Header -->
    <header>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="admin-sidebar" aria-expanded="false">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <a class="logo" href="#" aria-label="Ruma Home admin dashboard">
            <span class="logo-mark"><img src="https://dzgtfwdqfqecetnfhcdi.supabase.co/storage/v1/object/public/furniture-images/ruma_logo_white.png" alt=""></span>
            <span>Ruma Home</span>
        </a>

        <!-- log out button -->
        <div class="header-right">
            <button id="logout-btn" class="logout-btn" type="button">
                <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
                <span>Log out</span>
            </button>
        </div>

    </header>

    <div class="container">
        <!-- Sidebar -->
        <aside id="admin-sidebar">
            <nav class="admin-nav" aria-label="Admin navigation">
            <div class="menu-group">
                <div class="menu-title">Workspace</div>
                <a href="#" class="menu-item active" data-page="dashboard" aria-current="page">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i><span>Dashboard</span>
                </a>
                <a href="#" class="menu-item" data-page="products">
                    <i class="fa-solid fa-couch" aria-hidden="true"></i><span>Furniture</span>
                </a>
                <a href="#" class="menu-item" data-page="orders">
                    <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i><span>Orders</span>
                </a>
                <a href="#" class="menu-item" data-page="customer_feedback">
                    <i class="fa-solid fa-message" aria-hidden="true"></i><span>Customer feedback</span>
                </a>
            </div>
            </nav>
        </aside>
        <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

        <!-- Main Content -->
        <main id="main-content" tabindex="-1">
            
        </main>
    </div>

    <div id="admin-auth-loading" class="admin-auth-loading" role="status" aria-live="polite">
        <span class="loading-mark"><img src="https://dzgtfwdqfqecetnfhcdi.supabase.co/storage/v1/object/public/furniture-images/ruma_logo_white.png" alt=""></span>
        <span>Opening Ruma Home…</span>
    </div>

    <script type = "module" src = "../JS/admin_index.js"></script>
</body>
</html>
